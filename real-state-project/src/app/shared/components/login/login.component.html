<div class="login-container">
  <div class="login-card">
    <div class="login-heading">
      <mat-icon aria-hidden="true">home_work</mat-icon>
      <p>Área de gestión</p>
    </div>
    <h2>Iniciar sesión</h2>
    <p class="login-description">Accede para gestionar las viviendas y los clientes de TuHogar.</p>
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" formControlName="username" placeholder="Tu usuario" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" placeholder="Tu contraseña" autocomplete="current-password">
      </div>
      <button mat-raised-button color="primary" type="submit" [disabled]="!loginForm.valid">Iniciar sesión</button>
    </form>
    <p *ngIf="error" class="error-message" role="alert">{{ error }}</p>
    <a class="back-link" routerLink="/viviendas">Volver al catálogo</a>
  </div>
</div>
